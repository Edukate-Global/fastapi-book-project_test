name: Build and deploy app

jobs:
  
  deploy:
    runs-on: ubuntu-latest
    if: ${{github.ref == 'refs/heads/main'}}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/fastapi-book-api:${{ github.sha }}

      - name: Debug - Verify image exists
        run: |
          echo "Checking image: ${{ secrets.DOCKER_HUB_USERNAME }}/fastapi-book-api:${{ github.sha }}"
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/fastapi-book-api:${{ github.sha }}
          echo "Image details:"
          docker inspect ${{ secrets.DOCKER_HUB_USERNAME }}/fastapi-book-api:${{ github.sha }}

      - name: Configure Koyeb
        uses: koyeb-community/koyeb-actions@v2
        with: 
          api_token: "${{ secrets.KOYEB_API_TOKEN }}"

      - name: Deploy on Koyeb
        uses: koyeb/action-git-deploy@v1
        with:
          app-name: fastapi-book-api:$
          service-name: api
          service-type: web
          docker: docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/fastapi-book-api:${{ github.sha }}
        
          